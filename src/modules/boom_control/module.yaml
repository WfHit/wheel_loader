module_name: boom_control
parameters:
    - group: Boom Control
      definitions:
        BOOM_EN:
          description:
            short: Boom control enable
            long: Enable boom control module
          type: int32
          default: 1
          min: 0
          max: 1

        BOOM_RATE:
          description:
            short: Boom control update rate
            long: Control loop update frequency
          type: float
          default: 50.0
          min: 10.0
          max: 100.0
          unit: Hz
          decimal: 1

        BOOM_KIN_P_BASE:
          description:
            short: Pivot to actuator base distance
            long: Distance from boom pivot to actuator base mounting point
          type: float
          default: 150.0
          min: 50.0
          max: 1000.0
          unit: mm
          decimal: 1

        BOOM_KIN_P_ATT:
          description:
            short: Pivot to actuator attachment distance
            long: Distance from boom pivot to actuator attachment point
          type: float
          default: 200.0
          min: 50.0
          max: 1000.0
          unit: mm
          decimal: 1

        BOOM_KIN_B_ANG:
          description:
            short: Actuator base angle
            long: Angle of actuator base from horizontal
          type: float
          default: 45.0
          min: -90.0
          max: 90.0
          unit: deg
          decimal: 1

        BOOM_ACT_MIN:
          description:
            short: Minimum actuator length
            long: Minimum actuator extension
          type: float
          default: 100.0
          min: 50.0
          max: 500.0
          unit: mm
          decimal: 1

        BOOM_ACT_MAX:
          description:
            short: Maximum actuator length
            long: Maximum actuator extension
          type: float
          default: 300.0
          min: 100.0
          max: 800.0
          unit: mm
          decimal: 1

        BOOM_ANG_MIN:
          description:
            short: Minimum boom angle
            long: Minimum allowed boom angle
          type: float
          default: -30.0
          min: -90.0
          max: 90.0
          unit: deg
          decimal: 1

        BOOM_ANG_MAX:
          description:
            short: Maximum boom angle
            long: Maximum allowed boom angle
          type: float
          default: 60.0
          min: -90.0
          max: 90.0
          unit: deg
          decimal: 1

        BOOM_ENC_INST:
          description:
            short: Encoder instance
            long: AS5600 encoder instance to use
          type: int32
          default: 0
          min: 0
          max: 3

        BOOM_ENC_SCALE:
          description:
            short: Encoder scale factor
            long: Scale factor for encoder readings
          type: float
          default: 1.0
          min: 0.1
          max: 10.0
          decimal: 3

        BOOM_ENC_OFF:
          description:
            short: Encoder offset
            long: Offset for encoder calibration
          type: float
          default: 0.0
          min: -180.0
          max: 180.0
          unit: deg
          decimal: 1

        BOOM_ENC_REV:
          description:
            short: Encoder reverse
            long: Reverse encoder direction
          type: int32
          default: 0
          min: 0
          max: 1

        BOOM_POS_P:
          description:
            short: Position controller P gain
            long: Position controller proportional gain
          type: float
          default: 2.0
          min: 0.0
          max: 10.0
          decimal: 2

        BOOM_POS_I:
          description:
            short: Position controller I gain
            long: Position controller integral gain
          type: float
          default: 0.1
          min: 0.0
          max: 5.0
          decimal: 3

        BOOM_POS_D:
          description:
            short: Position controller D gain
            long: Position controller derivative gain
          type: float
          default: 0.05
          min: 0.0
          max: 1.0
          decimal: 3

        BOOM_VEL_P:
          description:
            short: Velocity controller P gain
            long: Velocity controller proportional gain
          type: float
          default: 3.0
          min: 0.0
          max: 10.0
          decimal: 2

        BOOM_VEL_I:
          description:
            short: Velocity controller I gain
            long: Velocity controller integral gain
          type: float
          default: 0.2
          min: 0.0
          max: 5.0
          decimal: 3

        BOOM_VEL_D:
          description:
            short: Velocity controller D gain
            long: Velocity controller derivative gain
          type: float
          default: 0.01
          min: 0.0
          max: 1.0
          decimal: 3

        BOOM_MAX_VEL:
          description:
            short: Maximum velocity
            long: Maximum boom angular velocity
          type: float
          default: 1.0
          min: 0.1
          max: 5.0
          unit: rad/s
          decimal: 2

        BOOM_MAX_ACC:
          description:
            short: Maximum acceleration
            long: Maximum boom angular acceleration
          type: float
          default: 2.0
          min: 0.1
          max: 10.0
          unit: rad/s^2
          decimal: 2

        BOOM_MAX_JERK:
          description:
            short: Maximum jerk
            long: Maximum boom angular jerk
          type: float
          default: 10.0
          min: 1.0
          max: 50.0
          unit: rad/s^3
          decimal: 1

        BOOM_DEADZONE:
          description:
            short: Motor deadzone
            long: Motor deadzone compensation
          type: float
          default: 0.05
          min: 0.0
          max: 0.5
          decimal: 3

        BOOM_FF_GAIN:
          description:
            short: Feedforward gain
            long: Feedforward control gain
          type: float
          default: 0.1
          min: 0.0
          max: 2.0
          decimal: 3

        BOOM_LOAD_COM:
          description:
            short: Load compensation gain
            long: Load compensation control gain
          type: float
          default: 0.0
          min: 0.0
          max: 2.0
          decimal: 3

        BOOM_MOTOR_IDX:
          description:
            short: Motor index
            long: H-bridge motor index to use
          type: int32
          default: 0
          min: 0
          max: 7

        BOOM_CUR_LIM:
          description:
            short: Current limit
            long: Motor current limit
          type: float
          default: 20.0
          min: 0.5
          max: 50.0
          unit: A
          decimal: 1

        BOOM_DUTY_MAX:
          description:
            short: Maximum duty cycle
            long: Maximum motor duty cycle
          type: float
          default: 1.0
          min: 0.1
          max: 1.0
          decimal: 2

        BOOM_CAL_REQ:
          description:
            short: Calibration required
            long: Require calibration on startup
          type: int32
          default: 1
          min: 0
          max: 1

        BOOM_CAL_TO:
          description:
            short: Calibration timeout
            long: Maximum time for calibration
          type: float
          default: 60.0
          min: 10.0
          max: 300.0
          unit: s
          decimal: 0

        BOOM_SET_TIME:
          description:
            short: Settle time
            long: Time to wait for system to settle
          type: float
          default: 2.0
          min: 0.5
          max: 10.0
          unit: s
          decimal: 1
