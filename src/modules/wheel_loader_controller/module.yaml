module_name: Wheel Loader Controller

parameters:
    - group: Wheel Loader Controller
      definitions:
        WLC_MAX_SPEED:
            description:
                short: Maximum allowed vehicle speed
                long: Maximum allowed vehicle speed for safety limiting
            type: float
            unit: m/s
            min: 0.1
            max: 20.0
            increment: 0.1
            decimal: 1
            default: 5.0

        WLC_MAX_ACCEL:
            description:
                short: Maximum allowed acceleration
                long: Maximum allowed acceleration for safety limiting
            type: float
            min: 0.1
            max: 10.0
            increment: 0.1
            decimal: 1
            default: 2.0

        WLC_CMD_TIMEOUT:
            description:
                short: Command timeout
                long: Maximum time without receiving commands before entering safe mode
            type: float
            unit: s
            min: 0.1
            max: 5.0
            increment: 0.1
            decimal: 1
            default: 0.5

        WLC_HEALTH_TO:
            description:
                short: Health monitoring timeout
                long: Maximum time without receiving status from subsystems before marking as unhealthy
            type: float
            unit: s
            min: 0.1
            max: 5.0
            increment: 0.1
            decimal: 1
            default: 1.0

        WLC_ESTOP_EN:
            description:
                short: Emergency stop enable
                long: Enable emergency stop functionality
            type: boolean
            default: true

        WLC_DIAG_EN:
            description:
                short: Diagnostic mode enable
                long: Enable diagnostic output and verbose logging
            type: boolean
            default: false

        WLC_CTRL_RATE:
            description:
                short: Control loop rate
                long: Main control loop execution rate
            type: float
            min: 10.0
            max: 200.0
            increment: 1.0
            decimal: 1
            default: 50.0

        WLC_SAFE_ACCEL:
            description:
                short: Safe acceleration limit
                long: Conservative acceleration limit used during autonomous operation
            type: float
            min: 0.1
            max: 5.0
            increment: 0.1
            decimal: 1
            default: 1.0

        WLC_SAFE_SPEED:
            description:
                short: Safe speed limit
                long: Conservative speed limit used during autonomous operation
            type: float
            unit: m/s
            min: 0.1
            max: 10.0
            increment: 0.1
            decimal: 1
            default: 2.0

        WLC_FRONT_WHEEL:
            description:
                short: Front wheel instance
                long: Instance ID for the front wheel status subscription
            type: int32
            min: 0
            max: 15
            default: 0

        WLC_REAR_WHEEL:
            description:
                short: Rear wheel instance
                long: Instance ID for the rear wheel status subscription
            type: int32
            min: 0
            max: 15
            default: 1

        WLC_OP_MODE:
            description:
                short: Operation mode
                long: Primary operation mode selection
            type: enum
            values:
                0: Manual RC Control
                1: VLA Autonomous
            default: 0

        WLC_VLA_EN:
            description:
                short: VLA interface enable
                long: Enable VLA autonomous control interface
            type: boolean
            default: true

        WLC_VLA_TO:
            description:
                short: VLA command timeout
                long: Maximum time without receiving VLA commands before fallback to manual
            type: float
            unit: s
            min: 0.1
            max: 5.0
            increment: 0.1
            decimal: 1
            default: 1.0

        WLC_MODE_TRANS_T:
            description:
                short: Mode transition time
                long: Time allowed for safe transition between operation modes
            type: float
            unit: s
            min: 0.1
            max: 3.0
            increment: 0.1
            decimal: 1
            default: 1.0

        WLC_AUTO_LOAD_EN:
            description:
                short: Auto load enable
                long: Enable autonomous loading sequence in VLA mode
            type: boolean
            default: true

        WLC_AUTO_DUMP_EN:
            description:
                short: Auto dump enable
                long: Enable autonomous dumping sequence in VLA mode
            type: boolean
            default: true