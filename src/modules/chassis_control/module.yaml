module_name: Advanced Chassis Control

maintainers:
  - name: PX4 Development Team

description:
  short: Advanced chassis control with MPC and slip-aware traction
  long: |
    This module provides advanced chassis control for the wheel loader including:
    - Model Predictive Control (MPC) for trajectory tracking
    - Slip estimation and traction optimization using existing slip_estimator
    - Load-aware torque distribution using existing load_aware_torque
    - Anti-slip regulation (ASR) and electronic stability control (ESP)
    - Power-aware torque distribution
    - Articulated steering coordination

    The module leverages existing articulated_chassis components for
    enhanced traction and stability control.

parameters:
  - group: Chassis Control
    definitions:
      CC_MASS:
        description:
          short: Vehicle mass
          long: Total mass of the wheel loader vehicle
        type: float
        unit: kg
        min: 1000
        max: 50000
        default: 5000
        decimal: 0

      CC_INERTIA:
        description:
          short: Vehicle moment of inertia
          long: Moment of inertia around vertical axis
        type: float
        unit: kg*m^2
        min: 1000
        max: 50000
        default: 8000
        decimal: 0

      CC_WHL_RAD:
        description:
          short: Wheel radius
          long: Radius of the drive wheels
        type: float
        unit: m
        min: 0.1
        max: 2.0
        default: 0.5
        decimal: 2

      CC_TRACK_W:
        description:
          short: Track width
          long: Distance between left and right wheels
        type: float
        unit: m
        min: 1.0
        max: 5.0
        default: 2.0
        decimal: 2

      CC_WHLBASE:
        description:
          short: Wheelbase
          long: Distance between front and rear axles
        type: float
        unit: m
        min: 1.0
        max: 10.0
        default: 3.0
        decimal: 2

      CC_MPC_EN:
        description:
          short: Enable MPC
          long: Enable Model Predictive Control for trajectory tracking
        type: int32
        values:
          0: Disabled
          1: Enabled
        default: 1

      CC_SLIP_EN:
        description:
          short: Enable slip control
          long: Enable slip estimation and traction control
        type: int32
        values:
          0: Disabled
          1: Enabled
        default: 1

      CC_ASR_EN:
        description:
          short: Enable ASR
          long: Enable Anti-Slip Regulation
        type: int32
        values:
          0: Disabled
          1: Enabled
        default: 1

      CC_ESP_EN:
        description:
          short: Enable ESP
          long: Enable Electronic Stability Program
        type: int32
        values:
          0: Disabled
          1: Enabled
        default: 1

      CC_MAX_SPD:
        description:
          short: Maximum speed
          long: Maximum linear velocity
        type: float
        unit: m/s
        min: 0.1
        max: 20.0
        default: 5.0
        decimal: 1

      CC_MAX_ACC:
        description:
          short: Maximum acceleration
          long: Maximum linear acceleration
        type: float
        unit: m/s^2
        min: 0.1
        max: 10.0
        default: 2.0
        decimal: 1

      CC_MAX_STR:
        description:
          short: Maximum steering angle
          long: Maximum articulation steering angle
        type: float
        unit: rad
        min: 0.1
        max: 1.57
        default: 0.785
        decimal: 3

      CC_SLIP_THR:
        description:
          short: Slip threshold
          long: Threshold for slip detection
        type: float
        min: 0.01
        max: 1.0
        default: 0.15
        decimal: 3

      CC_TRQ_MAX:
        description:
          short: Maximum torque
          long: Maximum wheel torque
        type: float
        unit: Nm
        min: 100
        max: 5000
        default: 2000
        decimal: 0
