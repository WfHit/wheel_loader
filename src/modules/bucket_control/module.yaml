module_name: Bucket Control
parameters:
    - group: Bucket Control
      definitions:
          BCT_HBRIDGE_CH:
              description:
                  short: Bucket H-bridge channel
                  long: H-bridge driver channel index for bucket motor control
              type: int32
              min: 0
              max: 15
              default: 0
          BCT_ENC_IDX:
              description:
                  short: Bucket encoder index
                  long: Index of the encoder in the wheel_encoders array for bucket position feedback
              type: int32
              min: 0
              max: 7
              default: 0
          BCT_LIM_LOAD:
              description:
                  short: Bucket load limit sensor instance
                  long: Limit sensor instance ID for the load limit at bucket down position
              type: int32
              min: 0
              max: 7
              default: 0
          BCT_LIM_DUMP:
              description:
                  short: Bucket dump limit sensor instance
                  long: Limit sensor instance ID for the dump limit at bucket up position
              type: int32
              min: 0
              max: 7
              default: 1
          BCT_BOOM_AS5600:
              description:
                  short: Boom angle AS5600 sensor instance
                  long: Instance ID for the AS5600 magnetic encoder that measures boom angle
              type: int32
              min: 0
              max: 7
              default: 0
          BCT_ACT_MIN:
              description:
                  short: Minimum actuator length
                  long: Minimum extension of the bucket actuator (mm)
              type: float
              min: 50.0
              default: 200.0
              decimal: 1
              unit: mm
          BCT_ACT_MAX:
              description:
                  short: Maximum actuator length
                  long: Maximum extension of the bucket actuator (mm)
              type: float
              min: 100.0
              default: 400.0
              decimal: 1
              unit: mm
          BCT_ANG_MIN:
              description:
                  short: Minimum bucket angle
                  long: Minimum bucket angle relative to boom (rad)
              type: float
              default: -1.57
              decimal: 3
              unit: rad
          BCT_ANG_MAX:
              description:
                  short: Maximum bucket angle
                  long: Maximum bucket angle relative to boom (rad)
              type: float
              default: 1.57
              decimal: 3
              unit: rad
          BCT_ENC_SCALE:
              description:
                  short: Encoder scale factor
                  long: Conversion factor from encoder counts to mm of actuator travel
              type: float
              default: 0.001
              decimal: 6
              unit: m
          BCT_PID_P:
              description:
                  short: Position control P gain
                  long: Proportional gain for bucket position control
              type: float
              min: 0.0
              max: 10.0
              default: 2.0
              decimal: 3
          BCT_PID_I:
              description:
                  short: Position control I gain
                  long: Integral gain for bucket position control
              type: float
              min: 0.0
              max: 5.0
              default: 0.1
              decimal: 3
          BCT_PID_D:
              description:
                  short: Position control D gain
                  long: Derivative gain for bucket position control
              type: float
              min: 0.0
              max: 2.0
              default: 0.05
              decimal: 3
          BCT_VEL_PID_P:
              description:
                  short: Velocity control P gain
                  long: Proportional gain for bucket velocity control
              type: float
              min: 0.0
              max: 10.0
              default: 1.0
              decimal: 3
          BCT_VEL_PID_I:
              description:
                  short: Velocity control I gain
                  long: Integral gain for bucket velocity control
              type: float
              min: 0.0
              max: 5.0
              default: 0.1
              decimal: 3
          BCT_VEL_PID_D:
              description:
                  short: Velocity control D gain
                  long: Derivative gain for bucket velocity control
              type: float
              min: 0.0
              max: 2.0
              default: 0.01
              decimal: 3
          BCT_MAX_VEL:
              description:
                  short: Maximum actuator velocity
                  long: Maximum velocity for bucket actuator (mm/s)
              type: float
              min: 10.0
              max: 500.0
              default: 100.0
              decimal: 1
          BCT_MAX_ACC:
              description:
                  short: Maximum actuator acceleration
                  long: Maximum acceleration for bucket actuator (mm/s²)
              type: float
              min: 50.0
              max: 1000.0
              default: 200.0
              decimal: 1
          BCT_JERK_LIM:
              description:
                  short: Maximum jerk limit
                  long: Maximum jerk for S-curve trajectory (mm/s³)
              type: float
              min: 100.0
              max: 5000.0
              default: 1000.0
              decimal: 1
          BCT_ZERO_FAST:
              description:
                  short: Zeroing fast speed
                  long: Speed factor for fast movement during zeroing (0.0 to 1.0)
              type: float
              min: 0.1
              max: 1.0
              default: 0.7
              decimal: 2
          BCT_ZERO_SLOW:
              description:
                  short: Zeroing slow speed
                  long: Speed factor for slow approach to fine limit (0.0 to 1.0)
              type: float
              min: 0.01
              max: 0.2
              default: 0.05
              decimal: 3
    - group: Bucket Geometry
      definitions:
          BCT_ACT_BASE_X:
              description:
                  short: Actuator base attachment X
                  long: X position of actuator base relative to boom pivot (mm)
              type: float
              default: -200.0
              decimal: 1
              unit: mm
          BCT_ACT_BASE_Y:
              description:
                  short: Actuator base attachment Y
                  long: Y position of actuator base relative to boom pivot (mm)
              type: float
              default: -100.0
              decimal: 1
              unit: mm
          BCT_BCRK_BOOM_X:
              description:
                  short: Bellcrank boom attachment X
                  long: X position of bellcrank pivot on boom (mm)
              type: float
              default: 300.0
              decimal: 1
              unit: mm
          BCT_BCRK_BOOM_Y:
              description:
                  short: Bellcrank boom attachment Y
                  long: Y position of bellcrank pivot on boom (mm)
              type: float
              default: 50.0
              decimal: 1
              unit: mm
          BCT_BKT_BOOM_X:
              description:
                  short: Bucket boom pivot X
                  long: X position of bucket pivot on boom (mm)
              type: float
              default: 600.0
              decimal: 1
              unit: mm
          BCT_BKT_BOOM_Y:
              description:
                  short: Bucket boom pivot Y
                  long: Y position of bucket pivot on boom (mm)
              type: float
              default: 0.0
              decimal: 1
              unit: mm
          BCT_BCRK_LENGTH:
              description:
                  short: Bellcrank length
                  long: Total length of bellcrank (mm)
              type: float
              min: 10.0
              default: 150.0
              decimal: 1
              unit: mm
          BCT_COUP_LENGTH:
              description:
                  short: Coupler length
                  long: Total length of coupler connecting bellcrank to bucket (mm)
              type: float
              min: 10.0
              default: 200.0
              decimal: 1
              unit: mm
          BCT_ACT_OFFSET:
              description:
                  short: Actuator attachment offset
                  long: Distance from bellcrank pivot to actuator attachment point (mm)
              type: float
              min: 10.0
              default: 50.0
              decimal: 1
              unit: mm
          BCT_BKT_ARM_LEN:
              description:
                  short: Bucket arm length
                  long: Distance from bucket pivot to coupler attachment point (mm)
              type: float
              min: 10.0
              default: 100.0
              decimal: 1
              unit: mm
          BCT_BCRK_INT_ANG:
              description:
                  short: Bellcrank internal angle
                  long: Fixed angle between bellcrank arms (actuator to coupler) in radians
              type: float
              min: -3.14159
              max: 3.14159
              default: 1.57
              decimal: 3
              unit: rad
          BCT_BKT_OFFSET:
              description:
                  short: Bucket attachment offset
                  long: Angular offset of bucket arm from coupler direction (rad)
              type: float
              default: 0.0
              decimal: 3
              unit: rad
          BCT_BOOM_LENGTH:
              description:
                  short: Boom length
                  long: Distance from boom pivot to bucket pivot (mm)
              type: float
              min: 100.0
              default: 800.0
              decimal: 1
              unit: mm
              values:
                  0: Disabled
                  1: Enabled
          BCT_CTRL_MODE:
              description:
                  short: Bucket control mode
                  long: "0: Manual, 1: Auto-level, 2: Slope compensation, 3: Grading, 4: Transport"
              type: int32
              min: 0
              max: 4
              default: 0
              values:
                  0: Manual
                  1: Auto-level
                  2: Slope compensation
                  3: Grading
                  4: Transport
          BCT_LEVEL_P:
              description:
                  short: Auto-level P gain
                  long: Proportional gain for auto-leveling control
              type: float
              min: 0.0
              max: 5.0
              default: 2.0
              decimal: 2
          BCT_LEVEL_D:
              description:
                  short: Auto-level D gain
                  long: Derivative gain for auto-leveling control
              type: float
              min: 0.0
              max: 2.0
              default: 0.2
              decimal: 3
          BCT_SLOPE_COMP:
              description:
                  short: Slope compensation factor
                  long: "How much to compensate for machine pitch (0.0 = none, 1.0 = full)"
              type: float
              min: 0.0
              max: 1.0
              default: 0.8
              decimal: 2
          BCT_GRADE_ANG:
              description:
                  short: Grading angle
                  long: Desired cutting angle for grading operations (rad)
              type: float
              min: -0.5
              max: 0.5
              default: -0.1
              decimal: 3
              unit: rad
          BCT_TRANS_ANG:
              description:
                  short: Transport angle
                  long: Safe bucket angle for material transport (rad)
              type: float
              min: 0.0
              max: 1.0
              default: 0.3
              decimal: 3
              unit: rad
          BCT_STAB_THR:
              description:
                  short: Stability threshold
                  long: Machine tilt angle threshold for stability limiting (rad)
              type: float
              min: 0.1
              max: 1.0
              default: 0.5
              decimal: 3
              unit: rad
          BCT_SPILL_THR:
              description:
                  short: Anti-spill threshold
                  long: Acceleration threshold for anti-spill activation (g)
              type: float
              min: 0.1
              max: 1.0
              default: 0.3
              decimal: 2
