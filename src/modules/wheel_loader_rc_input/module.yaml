module_name: Wheel Loader RC Input
maintainer: PX4 Development Team
description:
    short: RC input processing for wheel loader
    long: |
        This module processes RC/SBUS input signals and converts them to wheel loader
        control commands. It handles channel mapping for chassis movement, boom/bucket
        hydraulic controls, and safety features including emergency stop and failsafe.

parameters:
    - group: Wheel Loader RC Input
      definitions:
        WL_RC_MAX_SPEED:
            description:
                short: Maximum wheel speed for RC control
                long: Maximum wheel speed when using RC control (rad/s)
            type: float
            default: 5.0
            min: 0.5
            max: 10.0
            unit: rad/s
            
        WL_RC_MAX_STEER:
            description:
                short: Maximum steering angle for RC control  
                long: Maximum steering angle when using RC control (rad)
            type: float
            default: 0.7
            min: 0.1
            max: 1.5
            unit: rad
            
        WL_RC_DEADZONE:
            description:
                short: RC input deadzone
                long: RC input deadzone around center position
            type: float
            default: 0.05
            min: 0.0
            max: 0.2
            
        WL_RC_TIMEOUT:
            description:
                short: RC input timeout
                long: Time after which RC input is considered lost and failsafe is activated
            type: float
            default: 1.0
            min: 0.1
            max: 5.0
            unit: s
            
        WL_RC_ENABLE:
            description:
                short: Enable RC input
                long: Enable RC input processing for wheel loader control
            type: boolean
            default: 1