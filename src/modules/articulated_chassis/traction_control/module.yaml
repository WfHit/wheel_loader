module_name: traction_control

parameters:
  TC_ENABLE:
    description: Enable traction control
    type: int32
    default: 1
    min: 0
    max: 1

  TC_SLIP_P:
    description: Slip controller P gain
    type: float
    default: 1.0
    min: 0.0
    max: 2.0

  TC_SLIP_I:
    description: Slip controller I gain
    type: float
    default: 0.2
    min: 0.0
    max: 1.0

  TC_SLIP_D:
    description: Slip controller D gain
    type: float
    default: 0.1
    min: 0.0
    max: 0.5

  TC_TARGET_SLIP:
    description: Target slip ratio for maximum traction
    type: float
    default: 0.08
    min: 0.0
    max: 0.3

  TC_MAX_SLIP:
    description: Maximum allowed slip ratio
    type: float
    default: 0.15
    min: 0.05
    max: 0.5

  TC_FORCE_DIST:
    description: Default front force distribution ratio (0=all rear, 1=all front)
    type: float
    default: 0.4
    min: 0.1
    max: 0.9

  TC_WHEEL_RADIUS:
    description: Wheel radius in meters
    type: float
    default: 0.8
    min: 0.3
    max: 2.0
    unit: m

  TC_GEAR_RATIO:
    description: Motor to wheel gear ratio
    type: float
    default: 20.0
    min: 5.0
    max: 100.0

  TC_VEHICLE_MASS:
    description: Vehicle mass in kg
    type: float
    default: 15000.0
    min: 5000.0
    max: 50000.0
    unit: kg

  TC_WHEELBASE:
    description: Wheelbase in meters
    type: float
    default: 3.5
    min: 2.0
    max: 5.0
    unit: m

  TC_MAX_ARTIC:
    description: Maximum articulation angle in radians
    type: float
    default: 0.6
    min: 0.3
    max: 0.8
    unit: rad

  TC_STALL_THRESH:
    description: Minimum speed threshold for stall detection
    type: float
    default: 0.05
    min: 0.01
    max: 0.5
    unit: m/s

  TC_MAX_FORCE:
    description: Maximum force command per axle
    type: float
    default: 10000.0
    min: 1000.0
    max: 50000.0
    unit: N
