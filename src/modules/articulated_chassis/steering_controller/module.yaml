module_name: Steering Controller

parameters:
  - group: Steering Controller
    definitions:
      STEER_MAX_ANG:
        description:
          short: Maximum steering angle
          long: |
            Maximum allowed steering angle in radians for the articulated wheel loader.
            Default corresponds to ±45 degrees (±0.785 rad).
        type: float
        default: 0.785398
        min: 0.1
        max: 1.57
        unit: rad
        decimal: 3

      STEER_MAX_RATE:
        description:
          short: Maximum steering rate
          long: |
            Maximum steering angular velocity in rad/s.
            Default corresponds to 60°/s (1.047 rad/s).
        type: float
        default: 1.047198
        min: 0.1
        max: 3.14
        unit: rad/s
        decimal: 3

      STEER_DEADBAND:
        description:
          short: Steering deadband
          long: |
            Deadband around target position to reduce jitter.
            Default corresponds to 0.5 degrees (0.00873 rad).
        type: float
        default: 0.00873
        min: 0.0
        max: 0.1
        unit: rad
        decimal: 5

      STEER_TRIM:
        description:
          short: Steering trim offset
          long: |
            Constant offset added to steering commands for calibration.
            Used to correct for servo mounting or mechanical misalignment.
        type: float
        default: 0.0
        min: -0.2
        max: 0.2
        unit: rad
        decimal: 4

      STEER_REVERSE:
        description:
          short: Reverse steering direction
          long: |
            Invert steering direction if servo is mounted backwards
            or steering geometry requires reversal.
        type: int32
        default: 0
        values:
          0: Normal direction
          1: Reversed direction

      STEER_SLP_CP_EN:
        description:
          short: Enable slip compensation
          long: |
            Use PredictiveTraction data for slip-based steering compensation.
            Helps maintain vehicle control on slippery surfaces.
        type: int32
        default: 1
        values:
          0: Disabled
          1: Enabled

      STEER_SLP_CP_GN:
        description:
          short: Slip compensation gain
          long: |
            Gain for slip-based steering compensation.
            Higher values provide more aggressive slip correction.
        type: float
        default: 0.5
        min: 0.0
        max: 2.0
        decimal: 2

      STEER_SLP_CP_MA:
        description:
          short: Maximum slip compensation
          long: |
            Maximum slip compensation angle in radians.
            Limits the maximum steering correction due to slip.
            Default corresponds to 10 degrees (0.174533 rad).
        type: float
        default: 0.174533
        min: 0.0
        max: 0.5
        unit: rad
        decimal: 4

      STEER_FF_GAIN:
        description:
          short: Feedforward gain
          long: |
            Feedforward gain for improved dynamic response.
            Helps reduce tracking lag during rapid steering maneuvers.
        type: float
        default: 0.2
        min: 0.0
        max: 1.0
        decimal: 2

      STEER_FF_SPD_SC:
        description:
          short: Speed-dependent feedforward scaling
          long: |
            Scaling factor for speed-dependent feedforward control.
            Increases feedforward gain at higher vehicle speeds.
        type: float
        default: 0.1
        min: 0.0
        max: 0.5
        decimal: 2

      STEER_ST3125_ID:
        description:
          short: ST3125 Servo ID
          long: |
            CAN ID for the ST3125 steering servo.
            Must match the configured ID on the servo.
        type: int32
        default: 1
        min: 1
        max: 254

      STEER_ST3125_AN:
        description:
          short: ST3125 Maximum angle
          long: |
            Maximum steering angle supported by the ST3125 servo in radians.
            Default corresponds to ±45 degrees (±0.785 rad).
        type: float
        default: 0.785398
        min: 0.1
        max: 1.57
        unit: rad
        decimal: 3

      STEER_ST3125_VL:
        description:
          short: ST3125 Maximum velocity
          long: |
            Maximum angular velocity supported by the ST3125 servo in rad/s.
            Default corresponds to 60°/s (1.047 rad/s).
        type: float
        default: 1.047198
        min: 0.1
        max: 5.0
        unit: rad/s
        decimal: 3

      STEER_ST3125_CR:
        description:
          short: ST3125 Current limit
          long: |
            Maximum current limit for the ST3125 servo.
            Should not exceed servo specifications to prevent damage.
        type: float
        default: 2.0
        min: 0.5
        max: 10.0
        unit: A
        decimal: 1

      STEER_ST3125_DB:
        description:
          short: ST3125 Deadband
          long: |
            Position deadband for the ST3125 servo in radians.
            Servo won't move if within this range of target position.
            Default corresponds to 0.1 degrees (0.00175 rad).
        type: float
        default: 0.00175
        min: 0.0
        max: 0.1
        unit: rad
        decimal: 5

      STEER_MAX_POS:
        description:
          short: Maximum position error
          long: |
            Maximum allowable position error before triggering safety violation.
            Default corresponds to 10 degrees (0.174533 rad).
        type: float
        default: 0.174533
        min: 0.05
        max: 0.5
        unit: rad
        decimal: 4

      STEER_CMD_TO:
        description:
          short: Command timeout
          long: |
            Timeout for steering commands in milliseconds.
            Controller returns to center if no commands received within this time.
        type: float
        default: 500.0
        min: 100
        max: 5000
        unit: ms
        decimal: 0

      STEER_FB_TO:
        description:
          short: Servo feedback timeout
          long: |
            Timeout for servo feedback in milliseconds.
            Servo is considered unhealthy if no feedback received within this time.
        type: float
        default: 100.0
        min: 50
        max: 1000
        unit: ms
        decimal: 0

      STEER_SENS_TO:
        description:
          short: Sensor timeout
          long: |
            Timeout for limit sensor data in milliseconds.
            Sensors are considered unhealthy if no data received within this time.
        type: float
        default: 200.0
        min: 100
        max: 2000
        unit: ms
        decimal: 0

      STEER_PWM_MIN:
        description:
          short: Servo minimum PWM
          long: |
            Minimum PWM value for servo (deprecated - kept for compatibility).
            Used with legacy PWM-based servo control.
        type: float
        default: 1000.0
        min: 500.0
        max: 1500.0
        unit: us
        decimal: 0

      STEER_PWM_MAX:
        description:
          short: Servo maximum PWM
          long: |
            Maximum PWM value for servo (deprecated - kept for compatibility).
            Used with legacy PWM-based servo control.
        type: float
        default: 2000.0
        min: 1500.0
        max: 2500.0
        unit: us
        decimal: 0

      STEER_CURR_LT:
        description:
          short: Servo current limit
          long: |
            Maximum current limit for ST3125 servo.
            Protects servo from overcurrent damage.
        type: float
        default: 2.0
        min: 0.5
        max: 5.0
        unit: A
        decimal: 1

      STEER_LIMIT_EN:
        description:
          short: Enable limit sensors
          long: |
            Enable limit sensor monitoring for steering position limits.
            When enabled, the controller will stop at limit positions to prevent damage.
        type: int32
        default: 1
        values:
          0: Disabled
          1: Enabled

      STEER_LT_LF_ID:
        description:
          short: Left limit sensor instance
          long: |
            Instance ID of the left steering limit sensor.
            Must match the configured instance in the limit sensor module.
        type: int32
        default: 0
        min: 0
        max: 255

      STEER_LT_RT_ID:
        description:
          short: Right limit sensor instance
          long: |
            Instance ID of the right steering limit sensor.
            Must match the configured instance in the limit sensor module.
        type: int32
        default: 1
        min: 0
        max: 255

      STEER_LIMIT_MAR:
        description:
          short: Limit sensor margin
          long: |
            Safety margin in radians before limit sensor activation.
            Controller will respect this margin to avoid hitting hard limits.
        type: float
        default: 0.087
        min: 0.0
        max: 0.349
        unit: rad
        decimal: 3

      STEER_SAFETY_EN:
        description:
          short: Enable safety manager
          long: |
            Enable safety manager for fault detection and emergency stop functionality.
            Monitors servo faults, sensor faults, and safety violations.
        type: int32
        default: 1
        values:
          0: Disabled
          1: Enabled

      STEER_SAFE_POS:
        description:
          short: Safety position
          long: |
            Safe steering position in radians (typically center position).
            Controller will move to this position during safety violations.
        type: float
        default: 0.0
        min: -0.785
        max: 0.785
        unit: rad
        decimal: 3

      STEER_FT_TO:
        description:
          short: Fault timeout
          long: |
            Timeout in milliseconds before clearing safety violations.
            Safety violations are cleared after this timeout if no active faults exist.
        type: float
        default: 5000.0
        min: 1000
        max: 30000
        unit: ms
        decimal: 0

      STEER_MAX_VIOL:
        description:
          short: Maximum violations
          long: |
            Maximum number of safety violations before triggering emergency stop.
            After this many violations, manual intervention is required to clear.
        type: int32
        default: 10
        min: 1
        max: 100
