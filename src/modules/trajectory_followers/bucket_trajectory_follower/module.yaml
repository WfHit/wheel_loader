module_name: Bucket Trajectory Follower
serial_config:
  - command: bucket_trajectory_follower start
    port_config_param:
      name: TEL_FRSKY_CONFIG
      group: Radio Switches

parameters:
    - group: Bucket Trajectory Follower
      definitions:
        OMM_BUCKET_PID_PX_P:
            description:
                short: Bucket position X PID proportional gain
            type: float
            min: 0.0
            max: 10.0
            default: 1.0
            decimal: 2

        OMM_BUCKET_PID_PX_I:
            description:
                short: Bucket position X PID integral gain
            type: float
            min: 0.0
            max: 2.0
            default: 0.1
            decimal: 3

        OMM_BUCKET_PID_PX_D:
            description:
                short: Bucket position X PID derivative gain
            type: float
            min: 0.0
            max: 1.0
            default: 0.05
            decimal: 3

        OMM_BUCKET_PID_PY_P:
            description:
                short: Bucket position Y PID proportional gain
            type: float
            min: 0.0
            max: 10.0
            default: 1.0
            decimal: 2

        OMM_BUCKET_PID_PY_I:
            description:
                short: Bucket position Y PID integral gain
            type: float
            min: 0.0
            max: 2.0
            default: 0.1
            decimal: 3

        OMM_BUCKET_PID_PY_D:
            description:
                short: Bucket position Y PID derivative gain
            type: float
            min: 0.0
            max: 1.0
            default: 0.05
            decimal: 3

        OMM_BUCKET_PID_PZ_P:
            description:
                short: Bucket position Z PID proportional gain
            type: float
            min: 0.0
            max: 10.0
            default: 1.2
            decimal: 2

        OMM_BUCKET_PID_PZ_I:
            description:
                short: Bucket position Z PID integral gain
            type: float
            min: 0.0
            max: 2.0
            default: 0.15
            decimal: 3

        OMM_BUCKET_PID_PZ_D:
            description:
                short: Bucket position Z PID derivative gain
            type: float
            min: 0.0
            max: 1.0
            default: 0.08
            decimal: 3

        OMM_BUCKET_PID_R_P:
            description:
                short: Bucket roll PID proportional gain
            type: float
            min: 0.0
            max: 5.0
            default: 0.8
            decimal: 2

        OMM_BUCKET_PID_R_I:
            description:
                short: Bucket roll PID integral gain
            type: float
            min: 0.0
            max: 1.0
            default: 0.05
            decimal: 3

        OMM_BUCKET_PID_R_D:
            description:
                short: Bucket roll PID derivative gain
            type: float
            min: 0.0
            max: 0.5
            default: 0.02
            decimal: 3

        OMM_BUCKET_PID_P_P:
            description:
                short: Bucket pitch PID proportional gain
            type: float
            min: 0.0
            max: 5.0
            default: 0.8
            decimal: 2

        OMM_BUCKET_PID_P_I:
            description:
                short: Bucket pitch PID integral gain
            type: float
            min: 0.0
            max: 1.0
            default: 0.05
            decimal: 3

        OMM_BUCKET_PID_P_D:
            description:
                short: Bucket pitch PID derivative gain
            type: float
            min: 0.0
            max: 0.5
            default: 0.02
            decimal: 3

        OMM_BUCKET_PID_Y_P:
            description:
                short: Bucket yaw PID proportional gain
            type: float
            min: 0.0
            max: 5.0
            default: 0.6
            decimal: 2

        OMM_BUCKET_PID_Y_I:
            description:
                short: Bucket yaw PID integral gain
            type: float
            min: 0.0
            max: 1.0
            default: 0.03
            decimal: 3

        OMM_BUCKET_PID_Y_D:
            description:
                short: Bucket yaw PID derivative gain
            type: float
            min: 0.0
            max: 0.5
            default: 0.015
            decimal: 3

        OMM_BUCKET_MAX_VEL:
            description:
                short: Maximum bucket velocity
            type: float
            min: 0.1
            max: 5.0
            default: 2.0
            decimal: 1
            unit: m/s

        OMM_BUCKET_MAX_ACCEL:
            description:
                short: Maximum bucket acceleration
            type: float
            min: 0.1
            max: 10.0
            default: 3.0
            decimal: 1
            unit: m/s^2

        OMM_BUCKET_MAX_FORCE:
            description:
                short: Maximum bucket force
            type: float
            min: 100.0
            max: 10000.0
            default: 5000.0
            decimal: 0
            unit: N

        OMM_BOOM_EXT_MIN:
            description:
                short: Minimum boom extension
            type: float
            min: 0.0
            max: 3.0
            default: 0.5
            decimal: 1
            unit: m

        OMM_BOOM_EXT_MAX:
            description:
                short: Maximum boom extension
            type: float
            min: 1.0
            max: 5.0
            default: 3.5
            decimal: 1
            unit: m

        OMM_BOOM_LIFT_MIN:
            description:
                short: Minimum boom lift angle
            type: float
            min: -1.57
            max: 0.0
            default: -0.5
            decimal: 2
            unit: rad

        OMM_BOOM_LIFT_MAX:
            description:
                short: Maximum boom lift angle
            type: float
            min: 0.0
            max: 1.57
            default: 1.2
            decimal: 2
            unit: rad

        OMM_BUCKET_TILT_MIN:
            description:
                short: Minimum bucket tilt angle
            type: float
            min: -1.57
            max: 0.0
            default: -1.0
            decimal: 2
            unit: rad

        OMM_BUCKET_TILT_MAX:
            description:
                short: Maximum bucket tilt angle
            type: float
            min: 0.0
            max: 1.57
            default: 1.0
            decimal: 2
            unit: rad

        OMM_BUCKET_MASS:
            description:
                short: Bucket mass for gravity compensation
            type: float
            min: 10.0
            max: 1000.0
            default: 200.0
            decimal: 0
            unit: kg

        OMM_LOAD_COMP_EN:
            description:
                short: Enable load compensation
            type: float
            min: 0.0
            max: 1.0
            default: 1.0
            decimal: 0
