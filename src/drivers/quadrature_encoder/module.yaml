module_name: Quadrature Encoder Driver
parameters:
    - group: Quadrature Encoder
      definitions:
          QE_UPDATE_RATE:
              description:
                  short: Encoder update rate
                  long: Update rate for reading quadrature encoders in Hz
              type: int32
              min: 1
              max: 1000
              default: 50
              unit: Hz
          QE_FILTER_EN:
              description:
                  short: Enable signal filtering
                  long: Enable digital filtering for noise reduction on encoder signals
              type: bool
              default: true
          QE_MAX_ERR_RT:
              description:
                  short: Maximum error rate threshold
                  long: Maximum allowable error rate percentage before warnings
              type: float
              min: 0.1
              max: 50.0
              default: 5.0
              unit: "%"
          QE_PPR_0:
              description:
                  short: Encoder 0 pulses per revolution
                  long: Number of pulses per revolution for encoder instance 0
              type: int32
              min: 1
              max: 100000
              default: 1024
          QE_INVERT_0:
              description:
                  short: Invert encoder 0 direction
                  long: Invert the counting direction for encoder instance 0
              type: bool
              default: false
          QE_PPR_1:
              description:
                  short: Encoder 1 pulses per revolution
                  long: Number of pulses per revolution for encoder instance 1
              type: int32
              min: 1
              max: 100000
              default: 1024
          QE_INVERT_1:
              description:
                  short: Invert encoder 1 direction
                  long: Invert the counting direction for encoder instance 1
              type: bool
              default: false
          QE_PPR_2:
              description:
                  short: Encoder 2 pulses per revolution
                  long: Number of pulses per revolution for encoder instance 2
              type: int32
              min: 1
              max: 100000
              default: 1024
          QE_INVERT_2:
              description:
                  short: Invert encoder 2 direction
                  long: Invert the counting direction for encoder instance 2
              type: bool
              default: false
          QE_PPR_3:
              description:
                  short: Encoder 3 pulses per revolution
                  long: Number of pulses per revolution for encoder instance 3
              type: int32
              min: 1
              max: 100000
              default: 1024
          QE_INVERT_3:
              description:
                  short: Invert encoder 3 direction
                  long: Invert the counting direction for encoder instance 3
              type: bool
              default: false
