module_name: GPIO Quadrature Encoder Driver
parameters:
    - group: Quadrature Encoder 0
      definitions:
          QENC0_PPR:
              description:
                  short: Encoder 0 pulses per revolution
                  long: Number of encoder pulses per complete revolution for encoder 0
              type: int32
              min: 100
              max: 10000
              default: 1024
              increment: 1
          QENC0_MODE:
              description:
                  short: Encoder 0 operating mode
                  long: Encoder 0 operating mode selection
              type: int32
              min: 0
              max: 1
              default: 0
              values:
                  0: Relative mode
                  1: Absolute mode
          QENC0_RATE:
              description:
                  short: Encoder 0 update rate
                  long: Encoder 0 data update frequency
              type: int32
              min: 10
              max: 1000
              default: 50
              increment: 1
              unit: Hz
          QENC0_VEL_FILT:
              description:
                  short: Encoder 0 velocity filter
                  long: Encoder 0 velocity filtering coefficient (low-pass)
              type: float
              min: 0.01
              max: 1.0
              default: 0.1
              decimal: 3
              increment: 0.01
    - group: Quadrature Encoder 1
      definitions:
          QENC1_PPR:
              description:
                  short: Encoder 1 pulses per revolution
                  long: Number of encoder pulses per complete revolution for encoder 1
              type: int32
              min: 100
              max: 10000
              default: 1024
              increment: 1
          QENC1_MODE:
              description:
                  short: Encoder 1 operating mode
                  long: Encoder 1 operating mode selection
              type: int32
              min: 0
              max: 1
              default: 0
              values:
                  0: Relative mode
                  1: Absolute mode
          QENC1_RATE:
              description:
                  short: Encoder 1 update rate
                  long: Encoder 1 data update frequency
              type: int32
              min: 10
              max: 1000
              default: 50
              increment: 1
              unit: Hz
          QENC1_VEL_FILT:
              description:
                  short: Encoder 1 velocity filter
                  long: Encoder 1 velocity filtering coefficient (low-pass)
              type: float
              min: 0.01
              max: 1.0
              default: 0.1
              decimal: 3
              increment: 0.01
