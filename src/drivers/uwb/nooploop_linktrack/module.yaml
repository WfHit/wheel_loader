module_name: NoopLoop LinkTrack UWB Driver
serial_config:
    - command: nooploop_linktrack start -d ${SERIAL_DEV}
      port_config_param:
          name: UWB_CONFIG
          group: Serial

parameters:
    - group: UWB
      definitions:
          UWB_EN:
              description:
                  short: Enable NoopLoop LinkTrack UWB
                  long: Enable the NoopLoop LinkTrack UWB driver
              type: int32
              min: 0
              max: 1
              default: 0
          UWB_TAG_ID:
              description:
                  short: NoopLoop LinkTrack Tag ID
                  long: The tag ID for this vehicle (0-39)
              type: int32
              min: 0
              max: 39
              default: 0
          UWB_BAUD:
              description:
                  short: NoopLoop LinkTrack Baud Rate
                  long: Serial port baud rate for communication
              type: int32
              min: 9600
              max: 4000000
              default: 115200
          UWB_UPDATE_RATE:
              description:
                  short: NoopLoop LinkTrack Update Rate
                  long: Update rate in Hz for LP_MODE2
              type: int32
              min: 1
              max: 50
              default: 10
